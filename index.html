<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БУЦИГАРНЯ</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141A2E;
      --navy: #1B2540;
      --amber: #E3A62F;
      --amber-dark: #B8741A;
      --white: #FFFFFF;
      --card: rgba(255,255,255,0.05);
      --line: rgba(255,255,255,0.1);
      --font: 'Unbounded', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--white); font-family: var(--font); }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
    .nav-logo { color: var(--amber); font-size: 16px; letter-spacing: 1px; }

    .btn {
      background: linear-gradient(135deg, var(--amber), var(--amber-dark));
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .cart-count { margin-left: 6px; }

    .hero {
      padding: 80px 24px;
      background: radial-gradient(circle at 85% 20%, rgba(227,166,47,0.4), transparent 55%), var(--navy);
    }
    .hero h1 { font-size: 48px; line-height: 1.15; font-weight: 400; margin-bottom: 20px; }
    .hero-sub { color: var(--amber); font-size: 14px; line-height: 1.8; }

    .catalog-header { display: flex; justify-content: space-between; align-items: baseline; padding: 32px 24px 8px; }
    .catalog-header h2 { font-size: 22px; font-weight: 400; }
    #itemCount { color: var(--amber); font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 16px 24px 48px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card-img {
      height: 150px;
      padding: 12px;
      background: radial-gradient(circle at 50% 35%, #34457A, var(--navy));
    }
    .card-img svg, .card-img img { width: 100%; height: 100%; display: block; }
    .card-img img { object-fit: cover; }
    .card-body { padding: 14px; }
    .card-name { font-size: 14px; margin-bottom: 10px; }
    .card select {
      width: 100%; margin-bottom: 12px; padding: 8px;
      background: var(--navy); color: var(--white);
      border: 1px solid var(--line); border-radius: 8px; font-family: var(--font); font-size: 12px;
    }
    .card-foot { display: flex; justify-content: space-between; align-items: center; }
    .price { color: var(--amber); font-size: 15px; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; }
    .overlay.open { display: block; }
    .drawer {
      position: absolute; right: 0; top: 0; bottom: 0; width: 100%; max-width: 420px;
      background: var(--bg); border-left: 1px solid var(--line);
      padding: 20px; overflow-y: auto;
    }
    .drawer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .drawer h3 { font-size: 16px; font-weight: 400; }
    .close { background: none; border: none; color: var(--white); font-size: 22px; cursor: pointer; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .qty button { background: var(--navy); color: var(--white); border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; }
    .qty span { margin: 0 6px; }
    .total { display: flex; justify-content: space-between; margin: 16px 0; font-size: 14px; }
    .total b { color: var(--amber); font-weight: 400; }
    .empty { color: var(--line); font-size: 13px; padding: 20px 0; }
    form input {
      width: 100%; margin-bottom: 10px; padding: 12px;
      background: var(--card); color: var(--white);
      border: 1px solid var(--line); border-radius: 10px; font-family: var(--font); font-size: 12px;
    }
    form .btn { width: 100%; padding: 14px; }
    #msg { margin-top: 12px; font-size: 12px; color: var(--amber); }

    @media (max-width: 600px) {
      .hero h1 { font-size: 32px; }
      .hero { padding: 48px 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">БУЦИГАРНЯ</div>
    <button class="btn" onclick="toggleCart()">Кошик <span class="cart-count" id="cartCount">0</span></button>
  </nav>

  <section class="hero">
    <h1>Все для<br>кальяну</h1>
    <p class="hero-sub">Обладнання та аксесуари.<br>Персональні мундштуки.<br>Відправка по всій Україні. 18+</p>
  </section>

  <div class="catalog-header">
    <h2>КАТАЛОГ</h2>
    <span id="itemCount"></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="overlay" id="overlay">
    <div class="drawer">
      <div class="drawer-top">
        <h3>Ваше замовлення</h3>
        <button class="close" onclick="toggleCart()">×</button>
      </div>
      <div id="cartItems"></div>
      <div class="total"><span>Разом</span><b id="cartTotal">0 ₴</b></div>
      <form onsubmit="submitOrder(event)">
        <input type="text" id="name" placeholder="Ім'я">
        <input type="tel" id="phone" placeholder="Телефон">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="address" placeholder="Адреса доставки">
        <button class="btn" type="submit">Оформити замовлення</button>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://danit-n8n.duckdns.org/webhook/9722e688-c90e-49be-8c79-a2406e8dccbe';

    // Обгортка для всіх ілюстрацій: однакові лінії й колір, тому в кожному товарі пишемо тільки малюнок
    const icon = inner => `<svg viewBox="0 0 200 120" fill="rgba(227,166,47,0.18)" stroke="#E3A62F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

    const products = [
      {
        id: 1, name: 'Кальян (шахта)', price: 3200, colors: ['Чорний', 'Сталевий', 'Мідний'],
        img: icon('<path d="M88 8h24l-4 14H92z"/><ellipse cx="100" cy="26" rx="22" ry="4"/><rect x="96" y="30" width="8" height="34"/><circle cx="100" cy="88" r="24"/><path d="M104 44C150 44 156 92 124 98" fill="none"/>')
      },
      {
        id: 2, name: 'Колба скляна', price: 650, colors: ['Прозора', 'Димчаста', 'Синя'],
        img: icon('<rect x="91" y="10" width="18" height="30" rx="3"/><circle cx="100" cy="76" r="34"/><path d="M68 78q16-8 32 0t32 0" fill="none"/>')
      },
      {
        id: 3, name: 'Чаша глиняна', price: 420, colors: ['Теракот', 'Чорна'],
        img: icon('<path d="M58 40Q62 94 100 98Q138 94 142 40"/><ellipse cx="100" cy="40" rx="42" ry="10"/><circle cx="86" cy="40" r="2.5"/><circle cx="100" cy="42" r="2.5"/><circle cx="114" cy="40" r="2.5"/>')
      },
      {
        id: 4, name: 'Шланг силіконовий', price: 380, colors: ['Чорний', 'Синій', 'Червоний'],
        img: icon('<path d="M28 92C56 20 88 112 118 52S168 30 174 72" fill="none" stroke-width="7"/><rect x="168" y="62" width="14" height="22" rx="4" transform="rotate(-15 175 73)"/>')
      },
      {
        id: 5, name: 'Щипці для вугілля', price: 290, colors: ['Сталеві'],
        img: icon('<path d="M74 106L122 22M126 106L78 22" fill="none" stroke-width="6"/><circle cx="100" cy="64" r="6"/><circle cx="100" cy="14" r="7"/>')
      },
      {
        id: 6, name: 'Мундштук персональний', price: 1100, colors: ['Бурштин', 'Синя смола', 'Чорний'],
        img: icon('<g transform="rotate(-25 100 60)"><path d="M44 54L132 44V76L44 66z"/><rect x="130" y="40" width="9" height="40"/><rect x="139" y="44" width="24" height="32" rx="7"/><circle cx="52" cy="60" r="7" fill="none"/><path d="M84 52l6 8-6 8-6-8z" fill="#E3A62F"/></g>')
      }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('grid');
      grid.innerHTML = products.map(p => `
        <div class="card">
          <div class="card-img">${p.photo ? `<img src="${p.photo}" alt="${p.name}">` : p.img}</div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <select id="color-${p.id}">
              ${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
            <div class="card-foot">
              <span class="price">${p.price} ₴</span>
              <button class="btn" onclick="addToCart(${p.id})">В кошик</button>
            </div>
          </div>
        </div>
      `).join('');
      document.getElementById('itemCount').textContent = products.length + ' товарів';
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const color = document.getElementById('color-' + id).value;
      const existing = cart.find(i => i.id === id && i.color === color);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ id: id, name: product.name, color: color, price: product.price, qty: 1 });
      }
      renderCart();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function getTotal() {
      return cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    }

    function renderCart() {
      const box = document.getElementById('cartItems');
      if (cart.length === 0) {
        box.innerHTML = '<div class="empty">Кошик порожній</div>';
      } else {
        box.innerHTML = cart.map((i, idx) => `
          <div class="cart-row">
            <div>${i.name}<br><span style="color:var(--amber)">${i.color}</span></div>
            <div class="qty">
              <button onclick="changeQty(${idx}, -1)">−</button>
              <span>${i.qty}</span>
              <button onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }
      document.getElementById('cartTotal').textContent = getTotal() + ' ₴';
      document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
    }

    function toggleCart() {
      document.getElementById('overlay').classList.toggle('open');
    }

    async function submitOrder(e) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const address = document.getElementById('address').value.trim();

      if (cart.length === 0) { msg.textContent = 'Кошик порожній'; return; }
      if (!name || !phone || !email || !address) { msg.textContent = 'Заповніть усі поля'; return; }

      const payload = {
        name: name,
        phone: phone,
        email: email,
        address: address,
        items: cart.map(i => `${i.name} (${i.color}) x${i.qty}`).join(', '),
        total: getTotal(),
        created_at: new Date().toISOString()
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        msg.textContent = 'Дякуємо! Замовлення відправлено.';
        cart = [];
        renderCart();
        e.target.reset();
      } catch (err) {
        msg.textContent = 'Помилка відправки. Спробуйте ще раз.';
        console.log(err);
      }
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
